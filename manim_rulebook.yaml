version: "0.19"
latex_required: false
min_animations: 6

allow_imports:
  - "from manim import *"
  - "import numpy as np"

allow_classes:
  - Scene
  - Axes
  - NumberLine
  - NumberPlane
  - Dot
  - Line
  - VGroup
  - ValueTracker
  - DecimalNumber
  - Text
  - MathTex
  - Wiggle
  - AnimationGroup
  - LaggedStart
  - VectorField
  - StreamLines
  - ParametricFunction
  - Arrow
  - ArrowVectorField
  - always_redraw
  - UpdateFromAlphaFunc
  - Create
  - FadeIn
  - FadeOut
  - Write
  - Unwrite
  - Transform
  - ReplacementTransform
  - Indicate
  - MoveAlongPath
  - Rotate
  - MoveToTarget

banned_tokens:
  - "numbers_to_show="
  - "x_axis_label="
  - "y_axis_label="
  - ".points"
  - "get_graph("
  - "FunctionGraph("
  - "unit_size="  # on NumberPlane
  - ".wiggle("
  - "group.wiggle("
  - "PresetScene"
  - "SampleScene"
  - "TemplateScene"
  - "from manimlib"
  - "deprecated="

rewrite_rules:
  - pattern: "get_graph\\("
    replace: "plot("
  - pattern: "FunctionGraph\\("
    replace: "plot("
  - pattern: "Axes\\(([^)]*)x_axis_label\\s*=\\s*[^,\\)]+,?"
    replace: "Axes(\\1"
  - pattern: "Axes\\(([^)]*)y_axis_label\\s*=\\s*[^,\\)]+,?"
    replace: "Axes(\\1"
  - pattern: "numbers_to_show\\s*=\\s*[^,\\)]+,?"
    replace: ""
  - pattern: "\\.wiggle\\(\\)"
    replace: ""
  - pattern: "class\\s+PresetScene\\(Scene\\):"
    replace: "# removed preset scene per zero-tolerance dynamic rule"
  - pattern: "class\\s+SampleScene\\(Scene\\):"
    replace: "# removed sample scene per zero-tolerance dynamic rule"
  - pattern: "class\\s+TemplateScene\\(Scene\\):"
    replace: "# removed template scene per zero-tolerance dynamic rule"
