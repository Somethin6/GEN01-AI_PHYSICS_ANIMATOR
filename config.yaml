manim:
  first_pass_quality: "low"
  final_quality: "high"
  fps: 60
  scene_class: "MainScene"
  output_dir: "out"
  use_temp_scene_path: true

latex:
  require_healthy: false

ffmpeg:
  enable: true
  crf: 18
  preset: "medium"
  pix_fmt: "yuv420p"
  movflags_faststart: true
  scale_width: 1920
